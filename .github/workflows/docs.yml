name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway through, so the site is never left
# partially updated.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Must match the channel pinned in rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.99.0
  # Must match the version suggested in the justfile, so local builds render the same.
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@v2.9.2

      # Broken intra-doc links fail the build, so pull requests catch them before they publish.
      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # A prebuilt release installs in seconds, where `cargo install mdbook` compiles for minutes.
      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build guide
        run: mdbook build book

      # The guide is the site root and the API docs live under api/. rustdoc puts each crate in
      # its own folder, so api/ redirects to this one.
      - name: Assemble site
        run: |
          cp -r target/doc target/book/api
          echo '<meta http-equiv="refresh" content="0; url=db_data_structures/index.html">' \
            > target/book/api/index.html

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
