<title id="bitmap-index-roaring-title">Roaring splits row 65,543 into key 0x0001 and low half 7. Keys 0x0000, 0x0001 and 0x0002 point to an array container of three values, a bitmap container of 5,000 values in which bit 7 stands for row 65,543, and a run container of 60,000 values.</title>
