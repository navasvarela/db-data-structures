<text class="t t-mono t-a" x="528" y="41" text-anchor="middle">5 = 101</text>
<line class="line-a" x1="528" y1="50" x2="528" y2="86" marker-end="url(#column-encodings-bitpack-head-a)"/>
<text class="t-small t-muted" x="432" y="16" text-anchor="middle">value 1</text>
