<svg class="diagram" viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="column-encodings-bitpack-title">
<title id="column-encodings-bitpack-title">Packing 5, 1, 7 and 2 at width 3: value i fills bits 3i to 3i+2 of a little-endian bit stream, giving the bytes CD 05.</title>
