<svg class="diagram" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="column-encodings-delta-title">
<title id="column-encodings-delta-title">Delta encoding of 1000, 1010, 1020, 1031: deltas 10, 10, 11; minus the minimum delta 10 they become 0, 0, 1, packed at one bit each.</title>
