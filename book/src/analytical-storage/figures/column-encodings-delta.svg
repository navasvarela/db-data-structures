<rect class="box-a" x="258" y="140" width="44" height="26"/>
<text class="t t-mono t-a" x="280" y="158" text-anchor="middle">0</text>
<line class="line" x1="338" y1="46" x2="374" y2="76"/>
<line class="line" x1="422" y1="46" x2="386" y2="76"/>
<rect class="box" x="358" y="80" width="44" height="26"/>
