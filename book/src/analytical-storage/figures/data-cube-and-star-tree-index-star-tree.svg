<svg class="diagram" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-cube-and-star-tree-index-star-tree-title">
<title id="data-cube-and-star-tree-index-star-tree-title">Part of a star-tree with split order country, browser, locale. Star nodes, drawn dashed, aggregate over all values of their dimension. The query on country US grouped by locale follows root, country=US, browser=*, then locale=en and locale=fr.</title>
<text class="t-small t-muted" x="14" y="108">country</text>
<text class="t-small t-muted" x="14" y="178">browser</text>
<text class="t-small t-muted" x="14" y="248">locale</text>
<rect class="box-a" x="268" y="20" width="104" height="28"/>
<text class="t-small t-mono t-a" x="320" y="38.3" text-anchor="middle">root</text>
<line class="line" x1="320" y1="48" x2="140" y2="90"/>
<rect class="box" x="88" y="90" width="104" height="28"/>
<text class="t-small t-mono" x="140" y="108.3" text-anchor="middle">country=CA</text>
<line class="line-a" x1="320" y1="48" x2="320" y2="90"/>
<rect class="box-a" x="268" y="90" width="104" height="28"/>
<text class="t-small t-mono t-a" x="320" y="108.3" text-anchor="middle">country=US</text>
<line class="line" x1="320" y1="48" x2="500" y2="90"/>
<rect class="box dashed" x="448" y="90" width="104" height="28"/>
<text class="t-small t-mono" x="500" y="108.3" text-anchor="middle">country=*</text>
<text class="t-small t-muted" x="140" y="140" text-anchor="middle">…</text>
<text class="t-small t-muted" x="500" y="140" text-anchor="middle">…</text>
<line class="line" x1="320" y1="118" x2="180" y2="160"/>
<rect class="box" x="120.2" y="160" width="119.6" height="28"/>
<text class="t-small t-mono" x="180" y="178.3" text-anchor="middle">browser=chrome</text>
<line class="line" x1="320" y1="118" x2="320" y2="160"/>
<rect class="box" x="256.5" y="160" width="127" height="28"/>
<text class="t-small t-mono" x="320" y="178.3" text-anchor="middle">browser=firefox</text>
<line class="line-a" x1="320" y1="118" x2="460" y2="160"/>
<rect class="box-a dashed" x="408" y="160" width="104" height="28"/>
<text class="t-small t-mono t-a" x="460" y="178.3" text-anchor="middle">browser=*</text>
<text class="t-small t-muted" x="180" y="210" text-anchor="middle">…</text>
<text class="t-small t-muted" x="320" y="210" text-anchor="middle">…</text>
<line class="line-a" x1="460" y1="188" x2="346" y2="230"/>
<rect class="box-a" x="294" y="230" width="104" height="28"/>
<text class="t-small t-mono t-a" x="346" y="248.3" text-anchor="middle">locale=en</text>
<line class="line-a" x1="460" y1="188" x2="460" y2="230"/>
<rect class="box-a" x="408" y="230" width="104" height="28"/>
<text class="t-small t-mono t-a" x="460" y="248.3" text-anchor="middle">locale=fr</text>
<line class="line" x1="460" y1="188" x2="574" y2="230"/>
<rect class="box dashed" x="522" y="230" width="104" height="28"/>
<text class="t-small t-mono" x="574" y="248.3" text-anchor="middle">locale=*</text>
<text class="t-small t-mono t-a" x="320" y="288" text-anchor="middle">SUM(impressions) WHERE country = 'US' GROUP BY locale</text>
</svg>
