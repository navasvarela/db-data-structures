<svg class="diagram" viewBox="0 0 640 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deletion-vector-commit-title">
<title id="deletion-vector-commit-title">A delete commit. Snapshot N pairs part-0007.parquet with dv-1 {3, 4, 7}; the delete writes dv-2 {3, 4, 7, 11, 18, 29} and commits snapshot N+1, which pairs the same untouched data file with dv-2. dv-1 stays for readers of snapshot N.</title>
<defs><marker id="deletion-vector-commit-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="deletion-vector-commit-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-a" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="box" x="40" y="16" width="220" height="60"/>
<text class="t-small t-bold" x="150" y="36" text-anchor="middle">snapshot N</text>
<text class="t-small t-mono" x="150" y="54" text-anchor="middle">part-0007 + dv-1</text>
<rect class="box-a" x="380" y="16" width="220" height="60"/>
<text class="t-small t-bold t-a" x="490" y="36" text-anchor="middle">snapshot N+1</text>
<text class="t-small t-mono" x="490" y="54" text-anchor="middle">part-0007 + dv-2</text>
<line class="line-a" x1="264" y1="46" x2="376" y2="46" marker-end="url(#deletion-vector-commit-head-a)"/>
<text class="t-small t-a" x="320" y="38" text-anchor="middle">delete</text>
<text class="t-small t-mono t-a" x="320" y="62" text-anchor="middle">+ 11, 18, 29</text>
<rect class="box-muted" x="40" y="150" width="180" height="48"/>
<text class="t-small t-bold" x="130" y="170" text-anchor="middle">dv-1</text>
<text class="t-small t-mono" x="130" y="188" text-anchor="middle">{3, 4, 7}</text>
<rect class="box" x="250" y="150" width="140" height="48"/>
<text class="t-small t-mono" x="320" y="170" text-anchor="middle">part-0007.parquet</text>
<text class="t-small t-muted" x="320" y="188" text-anchor="middle">untouched</text>
<rect class="box-a" x="420" y="150" width="180" height="48"/>
<text class="t-small t-bold t-a" x="510" y="170" text-anchor="middle">dv-2</text>
<text class="t-small t-mono" x="510" y="188" text-anchor="middle">{3, 4, 7, 11, 18, 29}</text>
<line class="line" x1="130" y1="78" x2="130" y2="146" marker-end="url(#deletion-vector-commit-head)"/>
<line class="line" x1="210" y1="78" x2="290" y2="146" marker-end="url(#deletion-vector-commit-head)"/>
<line class="line-a" x1="430" y1="78" x2="350" y2="146" marker-end="url(#deletion-vector-commit-head-a)"/>
<line class="line-a" x1="510" y1="78" x2="510" y2="146" marker-end="url(#deletion-vector-commit-head-a)"/>
</svg>
