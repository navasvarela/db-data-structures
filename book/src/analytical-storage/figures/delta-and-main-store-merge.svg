<svg class="diagram" viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delta-and-main-store-merge-title">
<title id="delta-and-main-store-merge-title">Merging the main dictionary Berlin, Oslo, Paris, Rome (2-bit codes) with the delta dictionary Kyiv, Lima, Oslo gives Berlin, Kyiv, Lima, Oslo, Paris, Rome with 3-bit codes. Main codes 0, 1, 2, 3 become 0, 3, 4, 5; delta codes 0, 1, 2 become 1, 2, 3.</title>
<defs><marker id="delta-and-main-store-merge-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="delta-and-main-store-merge-head-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-b" d="M0,0L10,5L0,10z"/></marker></defs>
<text class="t-small t-bold" x="60" y="20">main dictionary, 2-bit codes</text>
<rect class="box" x="60" y="28" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="72" y="44">0</text>
<text class="t-small" x="96" y="44">Berlin</text>
<rect class="box" x="60" y="56" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="72" y="72">1</text>
<text class="t-small" x="96" y="72">Oslo</text>
<rect class="box" x="60" y="84" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="72" y="100">2</text>
<text class="t-small" x="96" y="100">Paris</text>
<rect class="box" x="60" y="112" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="72" y="128">3</text>
<text class="t-small" x="96" y="128">Rome</text>
<text class="t-small t-bold t-b" x="60" y="184">delta dictionary (sorted)</text>
<rect class="box-b" x="60" y="192" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="72" y="208">0</text>
<text class="t-small t-b" x="96" y="208">Kyiv</text>
<rect class="box-b" x="60" y="220" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="72" y="236">1</text>
<text class="t-small t-b" x="96" y="236">Lima</text>
<rect class="box-b" x="60" y="248" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="72" y="264">2</text>
<text class="t-small t-b" x="96" y="264">Oslo</text>
<text class="t-small t-bold t-a" x="420" y="60">merged, 3-bit codes</text>
<rect class="box-a" x="420" y="68" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="432" y="84">0</text>
<text class="t-small t-a" x="456" y="84">Berlin</text>
<rect class="box-a" x="420" y="96" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="432" y="112">1</text>
<text class="t-small t-a" x="456" y="112">Kyiv</text>
<rect class="box-a" x="420" y="124" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="432" y="140">2</text>
<text class="t-small t-a" x="456" y="140">Lima</text>
<rect class="box-a" x="420" y="152" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="432" y="168">3</text>
<text class="t-small t-a" x="456" y="168">Oslo</text>
<rect class="box-a" x="420" y="180" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="432" y="196">4</text>
<text class="t-small t-a" x="456" y="196">Paris</text>
<rect class="box-a" x="420" y="208" width="140" height="24"/>
<text class="t-small t-mono t-muted" x="432" y="224">5</text>
<text class="t-small t-a" x="456" y="224">Rome</text>
<line class="line" x1="202" y1="40" x2="416" y2="80" marker-end="url(#delta-and-main-store-merge-head)"/>
<line class="line" x1="202" y1="68" x2="416" y2="164" marker-end="url(#delta-and-main-store-merge-head)"/>
<line class="line" x1="202" y1="96" x2="416" y2="192" marker-end="url(#delta-and-main-store-merge-head)"/>
<line class="line" x1="202" y1="124" x2="416" y2="220" marker-end="url(#delta-and-main-store-merge-head)"/>
<line class="line-b" x1="202" y1="204" x2="416" y2="108" marker-end="url(#delta-and-main-store-merge-head-b)"/>
<line class="line-b" x1="202" y1="232" x2="416" y2="136" marker-end="url(#delta-and-main-store-merge-head-b)"/>
<line class="line-b" x1="202" y1="260" x2="416" y2="164" marker-end="url(#delta-and-main-store-merge-head-b)"/>
<text class="t-small t-mono" x="60" y="304">translation: main 0→0 1→3 2→4 3→5, delta 0→1 1→2 2→3</text>
</svg>
