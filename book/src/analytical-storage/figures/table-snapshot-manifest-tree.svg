<text class="t-small" x="340" y="169.3" text-anchor="middle">per manifest: path, counts, bounds</text>
<line class="line" x1="290" y1="186" x2="180" y2="220" marker-end="url(#table-snapshot-manifest-tree-head)"/>
<line class="line" x1="390" y1="186" x2="470" y2="220" marker-end="url(#table-snapshot-manifest-tree-head)"/>
