<svg class="diagram" viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="table-snapshot-manifest-tree-title">
<title id="table-snapshot-manifest-tree-title">Iceberg metadata tree: the catalog points to the current metadata file, whose current snapshot 42 names a manifest list; the manifest list names a data manifest and a delete manifest, which list data files and deletion vectors with their statistics.</title>
