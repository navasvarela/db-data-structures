<rect class="box-a" x="20" y="28" width="130" height="50"/>
<text class="t-small t-bold t-a" x="85" y="48.3" text-anchor="middle">catalog</text>
<text class="t-small" x="85" y="66.3" text-anchor="middle">table "events"</text>
<line class="line-a" x1="152" y1="53" x2="206" y2="53" marker-end="url(#table-snapshot-manifest-tree-head-a)"/>
<rect class="box" x="210" y="14" width="260" height="78"/>
<text class="t-small t-mono" x="340" y="39.3" text-anchor="middle">00042-&lt;uuid&gt;.metadata.json</text>
