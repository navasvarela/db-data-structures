<svg class="diagram" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logical-clocks-hlc-title">
<title id="logical-clocks-hlc-title">Hybrid logical clock stamps on two processes. P's clock reads 10 when it sends; Q's clock reads 8 when it receives, so Q stamps (10, 1), then (10, 2) at physical time 9, and (11, 0) once its clock passes 10.</title>
<defs><marker id="logical-clocks-hlc-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="logical-clocks-hlc-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-a" d="M0,0L10,5L0,10z"/></marker></defs>
<line class="line" x1="64" y1="60" x2="600" y2="60" marker-end="url(#logical-clocks-hlc-head)"/>
<line class="line" x1="64" y1="160" x2="600" y2="160" marker-end="url(#logical-clocks-hlc-head)"/>
<text class="t t-bold" x="50" y="65" text-anchor="end">P</text>
<text class="t t-bold" x="50" y="165" text-anchor="end">Q</text>
<line class="line-a" x1="170" y1="66" x2="270" y2="152" marker-end="url(#logical-clocks-hlc-head-a)"/>
<circle class="box-a" cx="170" cy="60" r="6"/>
<text class="t-small t-muted" x="170" y="30" text-anchor="middle">pt = 10</text>
<text class="t-small t-mono t-bold t-a" x="170" y="48" text-anchor="middle">(10, 0)</text>
<circle class="box" cx="110" cy="160" r="6"/>
<text class="t-small t-mono t-bold" x="110" y="184" text-anchor="middle">(7, 0)</text>
<text class="t-small t-muted" x="110" y="202" text-anchor="middle">pt = 7</text>
<circle class="box-a" cx="270" cy="160" r="6"/>
<text class="t-small t-mono t-bold t-a" x="270" y="184" text-anchor="middle">(10, 1)</text>
<text class="t-small t-muted" x="270" y="202" text-anchor="middle">pt = 8</text>
<circle class="box-a" cx="390" cy="160" r="6"/>
<text class="t-small t-mono t-bold t-a" x="390" y="184" text-anchor="middle">(10, 2)</text>
<text class="t-small t-muted" x="390" y="202" text-anchor="middle">pt = 9</text>
<circle class="box" cx="520" cy="160" r="6"/>
<text class="t-small t-mono t-bold" x="520" y="184" text-anchor="middle">(11, 0)</text>
<text class="t-small t-muted" x="520" y="202" text-anchor="middle">pt = 11</text>
<text class="t-small t-a" x="330" y="92">l jumps to the sender's 10</text>
<text class="t-small t-a" x="330" y="108">and c counts on</text>
<text class="t-small t-muted" x="520" y="124" text-anchor="middle">pt passes l: c resets</text>
<text class="t-small t-muted" x="600" y="212" text-anchor="end">time →</text>
</svg>
