<svg class="diagram" viewBox="0 0 640 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logical-clocks-stamps-title">
<title id="logical-clocks-stamps-title">The same events stamped by Lamport clocks and vector clocks. a3 has Lamport stamp 3 and b3 has 4, yet they are concurrent, which the vectors 3,0,0 and 2,3,0 show because neither is below the other.</title>
<defs><marker id="logical-clocks-stamps-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker></defs>
<line class="line" x1="64" y1="50" x2="600" y2="50" marker-end="url(#logical-clocks-stamps-head)"/>
<text class="t t-bold" x="50" y="55" text-anchor="end">A</text>
<line class="line" x1="64" y1="140" x2="600" y2="140" marker-end="url(#logical-clocks-stamps-head)"/>
<text class="t t-bold" x="50" y="145" text-anchor="end">B</text>
<line class="line" x1="64" y1="230" x2="600" y2="230" marker-end="url(#logical-clocks-stamps-head)"/>
<text class="t t-bold" x="50" y="235" text-anchor="end">C</text>
<line class="line" x1="230" y1="56" x2="310" y2="132" marker-end="url(#logical-clocks-stamps-head)"/>
<text class="t-small t-muted" x="280" y="95">m1</text>
<line class="line" x1="410" y1="146" x2="540" y2="222" marker-end="url(#logical-clocks-stamps-head)"/>
<text class="t-small t-muted" x="485" y="185">m2</text>
<circle class="box" cx="120" cy="50" r="6"/>
<circle class="box" cx="230" cy="50" r="6"/>
<circle class="box-b" cx="520" cy="50" r="6"/>
<circle class="box" cx="150" cy="140" r="6"/>
<circle class="box" cx="310" cy="140" r="6"/>
<circle class="box-b" cx="410" cy="140" r="6"/>
<circle class="box" cx="130" cy="230" r="6"/>
<circle class="box" cx="540" cy="230" r="6"/>
<text class="t-small t-bold" x="120" y="38" text-anchor="middle">a1: 1</text>
<text class="t-small t-mono" x="120" y="72" text-anchor="middle">[1,0,0]</text>
<text class="t-small t-bold" x="230" y="38" text-anchor="middle">a2: 2</text>
<text class="t-small t-mono" x="204" y="72" text-anchor="middle">[2,0,0]</text>
<text class="t-small t-bold t-b" x="520" y="38" text-anchor="middle">a3: 3</text>
<text class="t-small t-mono t-b" x="520" y="72" text-anchor="middle">[3,0,0]</text>
<text class="t-small t-bold" x="150" y="128" text-anchor="middle">b1: 1</text>
<text class="t-small t-mono" x="150" y="162" text-anchor="middle">[0,1,0]</text>
<text class="t-small t-bold" x="330" y="128" text-anchor="middle">b2: 3</text>
<text class="t-small t-mono" x="310" y="162" text-anchor="middle">[2,2,0]</text>
<text class="t-small t-bold t-b" x="410" y="128" text-anchor="middle">b3: 4</text>
<text class="t-small t-mono t-b" x="384" y="162" text-anchor="middle">[2,3,0]</text>
<text class="t-small t-bold" x="130" y="218" text-anchor="middle">c1: 1</text>
<text class="t-small t-mono" x="130" y="252" text-anchor="middle">[0,0,1]</text>
<text class="t-small t-bold" x="560" y="218" text-anchor="middle">c2: 5</text>
<text class="t-small t-mono" x="540" y="252" text-anchor="middle">[2,3,2]</text>
<text class="t-small t-muted" x="64" y="278">above: Lamport stamp; below: vector [A, B, C]</text>
</svg>
