<rect class="box-muted" x="403" y="150" width="54" height="28"/>
<text class="t-small t-mono t-muted" x="430" y="168" text-anchor="middle">h1</text>
<rect class="box-muted" x="473" y="150" width="54" height="28"/>
<text class="t-small t-mono t-muted" x="500" y="168" text-anchor="middle">h2</text>
