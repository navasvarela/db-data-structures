<svg class="diagram" viewBox="0 0 640 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="merkle-tree-compare-title">
<title id="merkle-tree-compare-title">Comparing replicas A and B: the roots differ, h01 matches so its subtree is skipped, h23 differs, h2 matches and h3 differs, so only the keys in 300 to 400 are exchanged.</title>
