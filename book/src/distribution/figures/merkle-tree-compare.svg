<rect class="box-warn" x="118" y="34" width="54" height="28"/>
<text class="t-small t-mono" x="145" y="52" text-anchor="middle">root</text>
<text class="t-small t-bold" x="465" y="18" text-anchor="middle">replica B</text>
<line class="line" x1="465" y1="62" x2="395" y2="92"/>
<line class="line" x1="465" y1="62" x2="535" y2="92"/>
