<text class="t-small" x="40" y="214">1. The roots differ: exchange h01 and h23.</text>
<text class="t-small" x="40" y="234">2. h01 is equal, so its subtree is skipped; h23 differs: exchange h2 and h3.</text>
<text class="t-small t-warn" x="40" y="254">3. h3 differs: exchange the keys in [300, 400) and reconcile them.</text>
