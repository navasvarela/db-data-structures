<svg class="diagram" viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="extendible-hashing-double-title">
<title id="extendible-hashing-double-title">Inserting k7 with hash ending 1001 into the full bucket B, whose local depth equals the global depth. The directory doubles to 8 entries, then B splits on bit 2 into B, ending in 001, and a new bucket E, ending in 101.</title>
<defs><marker id="extendible-hashing-double-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="extendible-hashing-double-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-a" d="M0,0L10,5L0,10z"/></marker><marker id="extendible-hashing-double-head-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-b" d="M0,0L10,5L0,10z"/></marker></defs>
<text class="t-small t-bold" x="102" y="26" text-anchor="middle">G = 3</text>
<text class="t-small t-bold" x="340" y="26">buckets</text>
<rect class="box" x="70" y="36" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="56.3" text-anchor="middle">000</text>
<rect class="box" x="70" y="68" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="88.3" text-anchor="middle">001</text>
<rect class="box" x="70" y="100" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="120.3" text-anchor="middle">010</text>
<rect class="box" x="70" y="132" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="152.3" text-anchor="middle">011</text>
<rect class="box-b" x="70" y="164" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="184.3" text-anchor="middle">100</text>
<rect class="box-a" x="70" y="196" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="216.3" text-anchor="middle">101</text>
<rect class="box-b" x="70" y="228" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="248.3" text-anchor="middle">110</text>
<rect class="box-b" x="70" y="260" width="64" height="32"/>
<text class="t-small t-mono" x="102" y="280.3" text-anchor="middle">111</text>
<rect class="box" x="340" y="36" width="250" height="50"/>
<text class="t-small t-bold" x="350" y="56">A</text>
<text class="t-small" x="370" y="56">L = 1</text>
<text class="t-small t-muted" x="580" y="56" text-anchor="end">ends in 0</text>
<text class="t-small t-mono" x="350" y="76">k1 …100, k4 …010</text>
<line class="line" x1="136" y1="52" x2="337" y2="46" marker-end="url(#extendible-hashing-double-head)"/>
<line class="line" x1="136" y1="116" x2="337" y2="56" marker-end="url(#extendible-hashing-double-head)"/>
<line class="line-b" x1="136" y1="180" x2="337" y2="66" marker-end="url(#extendible-hashing-double-head-b)"/>
<line class="line-b" x1="136" y1="244" x2="337" y2="76" marker-end="url(#extendible-hashing-double-head-b)"/>
<rect class="box" x="340" y="106" width="250" height="50"/>
<text class="t-small t-bold" x="350" y="126">B</text>
<text class="t-small" x="370" y="126">L = 3</text>
<text class="t-small t-muted" x="580" y="126" text-anchor="end">ends in 001</text>
<text class="t-small t-mono" x="350" y="146">k2 …001, k7 …1001</text>
<line class="line" x1="136" y1="84" x2="337" y2="131" marker-end="url(#extendible-hashing-double-head)"/>
<rect class="box" x="340" y="176" width="250" height="50"/>
<text class="t-small t-bold" x="350" y="196">C</text>
<text class="t-small" x="370" y="196">L = 2</text>
<text class="t-small t-muted" x="580" y="196" text-anchor="end">ends in 11</text>
<text class="t-small t-mono" x="350" y="216">k3 …111</text>
<line class="line" x1="136" y1="148" x2="337" y2="192.7" marker-end="url(#extendible-hashing-double-head)"/>
<line class="line-b" x1="136" y1="276" x2="337" y2="209.3" marker-end="url(#extendible-hashing-double-head-b)"/>
<rect class="box-a" x="340" y="246" width="250" height="50"/>
<text class="t-small t-bold" x="350" y="266">E</text>
<text class="t-small" x="370" y="266">L = 3</text>
<text class="t-small t-muted" x="580" y="266" text-anchor="end">ends in 101</text>
<text class="t-small t-mono" x="350" y="286">k5 …101</text>
<line class="line-a" x1="136" y1="212" x2="337" y2="271" marker-end="url(#extendible-hashing-double-head-a)"/>
</svg>
