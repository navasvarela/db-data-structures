<svg class="diagram" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="linear-hashing-split-title">
<title id="linear-hashing-split-title">After splitting bucket 2: hashes 6 and 14 move to the new bucket 6, the overflow page is freed, and the split pointer advances to 3.</title>
