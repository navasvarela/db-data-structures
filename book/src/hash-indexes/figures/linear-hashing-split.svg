<text class="t-small t-bold" x="460" y="100">5</text>
<text class="t-small t-muted" x="514" y="100" text-anchor="end">h</text>
<text class="t-small t-muted" x="515" y="104">1</text>
<text class="t-small t-mono" x="490" y="122" text-anchor="middle">5, 13</text>
<rect class="box-a" x="538" y="82" width="76" height="52"/>
<text class="t-small t-bold" x="546" y="100">6</text>
<text class="t-small t-muted" x="600" y="100" text-anchor="end">h</text>
<text class="t-small t-muted" x="601" y="104">1</text>
