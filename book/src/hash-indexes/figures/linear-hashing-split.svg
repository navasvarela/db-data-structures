<rect class="box-a" x="194" y="82" width="76" height="52"/>
<text class="t-small t-bold" x="202" y="100">2</text>
<text class="t-small t-muted" x="256" y="100" text-anchor="end">h</text>
<text class="t-small t-muted" x="257" y="104">1</text>
<text class="t-small t-mono" x="232" y="122" text-anchor="middle">2, 10</text>
<rect class="box" x="280" y="82" width="76" height="52"/>
<text class="t-small t-bold" x="288" y="100">3</text>
<text class="t-small t-muted" x="342" y="100" text-anchor="end">h</text>
<text class="t-small t-muted" x="343" y="104">0</text>
<text class="t-small t-mono" x="318" y="122" text-anchor="middle">3, 7</text>
<rect class="box" x="366" y="82" width="76" height="52"/>
<text class="t-small t-bold" x="374" y="100">4</text>
<text class="t-small t-muted" x="428" y="100" text-anchor="end">h</text>
<text class="t-small t-muted" x="429" y="104">1</text>
<text class="t-small t-mono" x="404" y="122" text-anchor="middle">4, 12</text>
