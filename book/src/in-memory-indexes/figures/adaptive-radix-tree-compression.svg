<line class="line" x1="250" y1="177" x2="250" y2="213"/>
<text class="t-small t-mono" x="255" y="198">\0</text>
<rect class="box" x="223" y="214" width="54" height="24"/>
<text class="t-small t-mono" x="250" y="230" text-anchor="middle">ART\0</text>
<circle class="box-muted" cx="150" cy="38" r="7"/>
<circle class="box-a" cx="150" cy="82" r="7"/>
<circle class="box-a" cx="95" cy="126" r="7"/>
