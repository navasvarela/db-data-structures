<text class="t-small t-mono" x="470" y="65" text-anchor="middle">prefix "A"</text>
<rect class="box-a" x="368" y="112" width="84" height="38"/>
<text class="t-small t-bold" x="410" y="128" text-anchor="middle">Node4</text>
<text class="t-small t-mono" x="410" y="143" text-anchor="middle">prefix ""</text>
<line class="line" x1="450" y1="72" x2="410" y2="111"/>
