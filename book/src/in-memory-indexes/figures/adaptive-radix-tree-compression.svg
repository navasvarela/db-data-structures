<svg class="diagram" viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adaptive-radix-tree-compression-title">
<title id="adaptive-radix-tree-compression-title">Left, a plain trie for AND, ANT, ANY and ART with one node per byte; right, the ART for the same keys, with only two inner nodes.</title>
<text class="t-small t-muted" x="155" y="16" text-anchor="middle">one node per byte</text>
<text class="t-small t-muted" x="485" y="16" text-anchor="middle">ART</text>
