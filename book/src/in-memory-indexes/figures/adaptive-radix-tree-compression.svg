<line class="line" x1="40" y1="177" x2="40" y2="213"/>
<text class="t-small t-mono" x="45" y="198">\0</text>
<rect class="box" x="13" y="214" width="54" height="24"/>
<text class="t-small t-mono" x="40" y="230" text-anchor="middle">AND\0</text>
<line class="line" x1="100" y1="177" x2="100" y2="213"/>
