<svg class="diagram" viewBox="0 0 640 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lsm-tree-read-path-title">
<title id="lsm-tree-read-path-title">A point lookup for h checks the active and immutable memtables, the level-0 files c–p and a–k newest first, skipping b–f, and finds h in level 1's file e–h; level 2 is not consulted.</title>
