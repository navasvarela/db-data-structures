<svg class="diagram" viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="b-link-tree-half-split-title">
<title id="b-link-tree-half-split-title">Leaf P splits in two steps. After the half split, new page Q is reachable only through P's right link, and a search for 75 moves right from P to Q. Then the parent gets a downlink to Q.</title>
