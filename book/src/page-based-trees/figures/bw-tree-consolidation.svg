<svg class="diagram" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bw-tree-consolidation-title">
<title id="bw-tree-consolidation-title">Consolidating PID 1: the delta chain is replayed into a new base leaf with keys 20, 30 and 40, and a compare-and-swap points the slot at it. The old chain is retired.</title>
<defs><marker id="bw-tree-consolidation-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="bw-tree-consolidation-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-a" d="M0,0L10,5L0,10z"/></marker></defs>
<text class="t-small t-muted" x="16" y="18">mapping table</text>
<rect class="box-muted" x="16" y="22" width="40" height="18"/>
<text class="t-small" x="36" y="36" text-anchor="middle">PID</text>
<rect class="box-muted" x="56" y="22" width="50" height="18"/>
<text class="t-small" x="81" y="36" text-anchor="middle">ptr</text>
<rect class="box" x="16" y="40" width="40" height="30"/>
<text class="t t-mono" x="36" y="60" text-anchor="middle">1</text>
<rect class="box" x="56" y="40" width="50" height="30"/>
<rect class="box-a" x="140" y="40" width="30" height="30"/>
<text class="t t-mono" x="155" y="60" text-anchor="middle">20</text>
<rect class="box-a" x="170" y="40" width="30" height="30"/>
<text class="t t-mono" x="185" y="60" text-anchor="middle">30</text>
<rect class="box-a" x="200" y="40" width="30" height="30"/>
<text class="t t-mono" x="215" y="60" text-anchor="middle">40</text>
<rect class="box-a" x="230" y="40" width="46" height="30"/>
<text class="t-small t-mono" x="253" y="60" text-anchor="middle">hk 50</text>
<rect class="box-muted" x="276" y="40" width="26" height="30"/>
<text class="t-small t-mono" x="289" y="60" text-anchor="middle">→2</text>
<circle class="head-a" cx="81" cy="55" r="2.5"/>
<line class="line-a" x1="81" y1="55" x2="138" y2="55" marker-end="url(#bw-tree-consolidation-head-a)"/>
<text class="t-small t-a" x="312" y="60">new base, installed by CAS</text>
<rect class="box-muted" x="140" y="124" width="100" height="30" rx="8"/>
<text class="t-small" x="190" y="144" text-anchor="middle">Δ insert 30</text>
<rect class="box-muted" x="266" y="124" width="100" height="30" rx="8"/>
<text class="t-small" x="316" y="144" text-anchor="middle">Δ delete 10</text>
<rect class="box-muted" x="392" y="124" width="30" height="30"/>
<text class="t t-mono" x="407" y="144" text-anchor="middle">10</text>
<rect class="box-muted" x="422" y="124" width="30" height="30"/>
<text class="t t-mono" x="437" y="144" text-anchor="middle">20</text>
<rect class="box-muted" x="452" y="124" width="30" height="30"/>
<text class="t t-mono" x="467" y="144" text-anchor="middle">40</text>
<rect class="box-muted" x="482" y="124" width="46" height="30"/>
<text class="t-small t-mono" x="505" y="144" text-anchor="middle">hk 50</text>
<rect class="box-muted" x="528" y="124" width="26" height="30"/>
<text class="t-small t-mono" x="541" y="144" text-anchor="middle">→2</text>
<line class="line dashed" x1="240" y1="139" x2="264" y2="139" marker-end="url(#bw-tree-consolidation-head)"/>
<line class="line dashed" x1="366" y1="139" x2="390" y2="139" marker-end="url(#bw-tree-consolidation-head)"/>
<path class="line dashed" d="M81,61 L81,139 L138,139" marker-end="url(#bw-tree-consolidation-head)"/>
<text class="t-small t-muted" x="140" y="176">old chain: retired, freed once no thread can still be reading it</text>
<text class="t-small t-muted" x="89" y="101">before</text>
</svg>
