<svg class="diagram" viewBox="0 0 640 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bw-tree-layout-title">
<title id="bw-tree-layout-title">A Bw-tree mapping table with three PIDs. PID 0 points to an inner base node; PID 1 points to a chain of two delta records ending in a leaf base node; PID 2 points to a leaf base node.</title>
<defs><marker id="bw-tree-layout-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker></defs>
<text class="t-small t-muted" x="16" y="18">mapping table</text>
<rect class="box-muted" x="16" y="22" width="40" height="18"/>
<text class="t-small" x="36" y="36" text-anchor="middle">PID</text>
<rect class="box-muted" x="56" y="22" width="50" height="18"/>
<text class="t-small" x="81" y="36" text-anchor="middle">ptr</text>
<rect class="box" x="16" y="40" width="40" height="30"/>
<text class="t t-mono" x="36" y="60" text-anchor="middle">0</text>
<rect class="box" x="56" y="40" width="50" height="30"/>
<rect class="box" x="16" y="100" width="40" height="30"/>
<text class="t t-mono" x="36" y="120" text-anchor="middle">1</text>
<rect class="box" x="56" y="100" width="50" height="30"/>
<rect class="box" x="16" y="160" width="40" height="30"/>
<text class="t t-mono" x="36" y="180" text-anchor="middle">2</text>
<rect class="box" x="56" y="160" width="50" height="30"/>
<rect class="box-muted" x="140" y="40" width="26" height="30"/>
<text class="t-small t-mono" x="153" y="60" text-anchor="middle">1</text>
<rect class="box" x="166" y="40" width="34" height="30"/>
<text class="t t-mono" x="183" y="60" text-anchor="middle">50</text>
<rect class="box-muted" x="200" y="40" width="26" height="30"/>
<text class="t-small t-mono" x="213" y="60" text-anchor="middle">2</text>
<circle class="head" cx="81" cy="55" r="2.5"/>
<line class="line" x1="81" y1="55" x2="138" y2="55" marker-end="url(#bw-tree-layout-head)"/>
<text class="t-small t-muted" x="236" y="60">inner</text>
<rect class="box-b" x="140" y="100" width="100" height="30" rx="8"/>
<text class="t-small" x="190" y="120" text-anchor="middle">Δ insert 30</text>
<rect class="box-b" x="266" y="100" width="100" height="30" rx="8"/>
<text class="t-small" x="316" y="120" text-anchor="middle">Δ delete 10</text>
<rect class="box" x="392" y="100" width="30" height="30"/>
<text class="t t-mono" x="407" y="120" text-anchor="middle">10</text>
<rect class="box" x="422" y="100" width="30" height="30"/>
<text class="t t-mono" x="437" y="120" text-anchor="middle">20</text>
<rect class="box" x="452" y="100" width="30" height="30"/>
<text class="t t-mono" x="467" y="120" text-anchor="middle">40</text>
<rect class="box" x="482" y="100" width="46" height="30"/>
<text class="t-small t-mono" x="505" y="120" text-anchor="middle">hk 50</text>
<rect class="box-muted" x="528" y="100" width="26" height="30"/>
<text class="t-small t-mono" x="541" y="120" text-anchor="middle">→2</text>
<circle class="head" cx="81" cy="115" r="2.5"/>
<line class="line" x1="81" y1="115" x2="138" y2="115" marker-end="url(#bw-tree-layout-head)"/>
<line class="line" x1="240" y1="115" x2="264" y2="115" marker-end="url(#bw-tree-layout-head)"/>
<line class="line" x1="366" y1="115" x2="390" y2="115" marker-end="url(#bw-tree-layout-head)"/>
<text class="t-small t-muted" x="564" y="120">leaf</text>
<rect class="box" x="140" y="160" width="30" height="30"/>
<text class="t t-mono" x="155" y="180" text-anchor="middle">50</text>
<rect class="box" x="170" y="160" width="30" height="30"/>
<text class="t t-mono" x="185" y="180" text-anchor="middle">60</text>
<rect class="box" x="200" y="160" width="30" height="30"/>
<text class="t t-mono" x="215" y="180" text-anchor="middle">70</text>
<circle class="head" cx="81" cy="175" r="2.5"/>
<line class="line" x1="81" y1="175" x2="138" y2="175" marker-end="url(#bw-tree-layout-head)"/>
<text class="t-small t-muted" x="240" y="180">leaf</text>
</svg>
