<svg class="diagram" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bw-tree-update-title">
<title id="bw-tree-update-title">Inserting key 30: a new delta record is built pointing at the current head of PID 1's chain, then a compare-and-swap moves PID 1's slot from the old head to the new delta.</title>
<defs><marker id="bw-tree-update-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="bw-tree-update-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-a" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="box-muted" x="16" y="78" width="40" height="18"/>
<text class="t-small" x="36" y="92" text-anchor="middle">PID</text>
<rect class="box-muted" x="56" y="78" width="50" height="18"/>
<text class="t-small" x="81" y="92" text-anchor="middle">ptr</text>
<rect class="box" x="16" y="96" width="40" height="30"/>
<text class="t t-mono" x="36" y="116" text-anchor="middle">1</text>
<rect class="box" x="56" y="96" width="50" height="30"/>
<rect class="box-b" x="326" y="96" width="100" height="30" rx="8"/>
<text class="t-small" x="376" y="116" text-anchor="middle">Δ delete 10</text>
<rect class="box" x="452" y="96" width="30" height="30"/>
<text class="t t-mono" x="467" y="116" text-anchor="middle">10</text>
<rect class="box" x="482" y="96" width="30" height="30"/>
<text class="t t-mono" x="497" y="116" text-anchor="middle">20</text>
<rect class="box" x="512" y="96" width="30" height="30"/>
<text class="t t-mono" x="527" y="116" text-anchor="middle">40</text>
<rect class="box" x="542" y="96" width="46" height="30"/>
<text class="t-small t-mono" x="565" y="116" text-anchor="middle">hk 50</text>
<rect class="box-muted" x="588" y="96" width="26" height="30"/>
<text class="t-small t-mono" x="601" y="116" text-anchor="middle">→2</text>
<line class="line" x1="426" y1="111" x2="450" y2="111" marker-end="url(#bw-tree-update-head)"/>
<text class="t-small t-muted" x="16" y="146">mapping table</text>
<rect class="box-a" x="180" y="30" width="100" height="30" rx="8"/>
<text class="t-small" x="230" y="50" text-anchor="middle">Δ insert 30</text>
<line class="line-a" x1="280" y1="45" x2="336" y2="94" marker-end="url(#bw-tree-update-head-a)"/>
<text class="t-small t-a" x="290" y="34">1. build it, pointing at p</text>
<circle class="head" cx="81" cy="111" r="2.5"/>
<line class="line dashed" x1="81" y1="111" x2="324" y2="111" marker-end="url(#bw-tree-update-head)"/>
<text class="t-small t-muted" x="233.5" y="139" text-anchor="middle">p, the old head</text>
<path class="line-a" d="M81,111 C141,103 130,45 178,45" marker-end="url(#bw-tree-update-head-a)"/>
<text class="t-small t-a" x="16" y="34">2. CAS the slot</text>
<text class="t-small t-a" x="16" y="50">from p to it</text>
</svg>
