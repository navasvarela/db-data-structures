<svg class="diagram" viewBox="0 0 640 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="partitioned-hash-table-aggregate-title">
<title id="partitioned-hash-table-aggregate-title">Two threads pre-aggregate into small local tables and flush them into per-thread partition buffers; then each partition's buffers from both threads are merged into one table by a single thread.</title>
