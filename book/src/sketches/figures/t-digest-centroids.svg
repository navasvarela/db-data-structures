<svg class="diagram" viewBox="0 0 640 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-digest-centroids-title">
<title id="t-digest-centroids-title">Eleven centroids along the value axis with weights 1, 2, 6, 14, 31, 40, 33, 15, 5, 2 and 1: small near the minimum and maximum, large near the median.</title>
<text class="t-small t-muted" x="30" y="30">weight</text>
<line class="line" x1="30" y1="92" x2="610" y2="92"/>
<circle class="box-a" cx="60" cy="92" r="5.6"/>
<text class="t-small t-mono" x="60" y="52" text-anchor="middle">1</text>
<circle class="box-a" cx="112" cy="92" r="6.7"/>
<text class="t-small t-mono" x="112" y="52" text-anchor="middle">2</text>
<circle class="box-a" cx="164" cy="92" r="9.4"/>
<text class="t-small t-mono" x="164" y="52" text-anchor="middle">6</text>
<circle class="box-a" cx="216" cy="92" r="12.7"/>
<text class="t-small t-mono" x="216" y="52" text-anchor="middle">14</text>
<circle class="box-a" cx="268" cy="92" r="17.5"/>
<text class="t-small t-mono" x="268" y="52" text-anchor="middle">31</text>
<circle class="box-a" cx="320" cy="92" r="19.4"/>
<text class="t-small t-mono" x="320" y="52" text-anchor="middle">40</text>
<circle class="box-a" cx="372" cy="92" r="17.9"/>
<text class="t-small t-mono" x="372" y="52" text-anchor="middle">33</text>
<circle class="box-a" cx="424" cy="92" r="13.1"/>
<text class="t-small t-mono" x="424" y="52" text-anchor="middle">15</text>
<circle class="box-a" cx="476" cy="92" r="8.8"/>
<text class="t-small t-mono" x="476" y="52" text-anchor="middle">5</text>
<circle class="box-a" cx="528" cy="92" r="6.7"/>
<text class="t-small t-mono" x="528" y="52" text-anchor="middle">2</text>
<circle class="box-a" cx="580" cy="92" r="5.6"/>
<text class="t-small t-mono" x="580" y="52" text-anchor="middle">1</text>
<text class="t-small t-muted" x="60" y="132" text-anchor="middle">min</text>
<text class="t-small t-muted" x="320" y="132" text-anchor="middle">median</text>
<text class="t-small t-muted" x="580" y="132" text-anchor="middle">max</text>
<text class="t-small t-muted" x="112" y="154" text-anchor="middle">small clusters</text>
