<svg class="diagram" viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="theta-sketch-set-ops-title">
<title id="theta-sketch-set-ops-title">Sketch A has theta 0.62 and sketch B theta 0.47, with k = 4. Their intersection keeps the shared hashes 0.08 and 0.35 below 0.47; their union keeps the four smallest hashes below 0.47 and lowers theta to 0.41.</title>
<text class="t t-bold" x="70" y="45" text-anchor="end">A</text>
<line class="line" x1="90" y1="40" x2="520" y2="40"/>
<line class="line-a" x1="470.9" y1="26" x2="470.9" y2="50"/>
<text class="t-small t-bold t-a" x="470.9" y="22" text-anchor="middle">θ</text>
<circle class="box-a" cx="139.1" cy="40" r="6"/>
<text class="t-small t-mono" x="139.1" y="64" text-anchor="middle">0.08</text>
<circle class="box-a" cx="219" cy="40" r="6"/>
<text class="t-small t-mono" x="219" y="64" text-anchor="middle">0.21</text>
<circle class="box-a" cx="305" cy="40" r="6"/>
<text class="t-small t-mono" x="305" y="64" text-anchor="middle">0.35</text>
<circle class="box-muted" cx="397.1" cy="40" r="6"/>
<text class="t-small t-mono t-muted" x="397.1" y="28" text-anchor="middle">0.50</text>
<text class="t-small t-muted" x="540" y="45">θ_A = 0.62</text>
<text class="t t-bold" x="70" y="101" text-anchor="end">B</text>
<line class="line" x1="90" y1="96" x2="520" y2="96"/>
<line class="line-b" x1="378.7" y1="82" x2="378.7" y2="106"/>
<circle class="box-b" cx="139.1" cy="96" r="6"/>
<text class="t-small t-mono" x="139.1" y="120" text-anchor="middle">0.08</text>
<circle class="box-b" cx="194.4" cy="96" r="6"/>
<text class="t-small t-mono" x="194.4" y="120" text-anchor="middle">0.17</text>
<circle class="box-b" cx="305" cy="96" r="6"/>
<text class="t-small t-mono" x="305" y="120" text-anchor="middle">0.35</text>
<circle class="box-b" cx="341.9" cy="96" r="6"/>
<text class="t-small t-mono" x="341.9" y="120" text-anchor="middle">0.41</text>
<text class="t-small t-muted" x="540" y="101">θ_B = 0.47</text>
<text class="t t-bold" x="70" y="191" text-anchor="end">A ∩ B</text>
<line class="line" x1="90" y1="186" x2="520" y2="186"/>
<line class="line-a" x1="378.7" y1="172" x2="378.7" y2="196"/>
<text class="t-small t-bold t-a" x="378.7" y="168" text-anchor="middle">θ</text>
<circle class="box-a" cx="139.1" cy="186" r="6"/>
<text class="t-small t-mono" x="139.1" y="210" text-anchor="middle">0.08</text>
<circle class="box-a" cx="305" cy="186" r="6"/>
<text class="t-small t-mono" x="305" y="210" text-anchor="middle">0.35</text>
<text class="t-small" x="540" y="191">2 / 0.47 ≈ 4.3</text>
<text class="t t-bold" x="70" y="247" text-anchor="end">A ∪ B</text>
<line class="line" x1="90" y1="242" x2="520" y2="242"/>
<line class="line-a" x1="341.9" y1="228" x2="341.9" y2="252"/>
<text class="t-small t-bold t-a" x="341.9" y="224" text-anchor="middle">θ</text>
<circle class="box-a" cx="139.1" cy="242" r="6"/>
<text class="t-small t-mono" x="139.1" y="266" text-anchor="middle">0.08</text>
<circle class="box-a" cx="194.4" cy="242" r="6"/>
<text class="t-small t-mono" x="194.4" y="266" text-anchor="middle">0.17</text>
<circle class="box-a" cx="219" cy="242" r="6"/>
<text class="t-small t-mono" x="219" y="230" text-anchor="middle">0.21</text>
<circle class="box-a" cx="305" cy="242" r="6"/>
<text class="t-small t-mono" x="305" y="266" text-anchor="middle">0.35</text>
<circle class="box-muted" cx="341.9" cy="242" r="6"/>
<text class="t-small" x="540" y="247">4 / 0.41 ≈ 9.8</text>
<line class="line-b dashed" x1="378.7" y1="30" x2="378.7" y2="106"/>
<text class="t-small t-b" x="386.7" y="122">common θ = 0.47</text>
<line class="line dashed" x1="30" y1="152" x2="630" y2="152"/>
</svg>
