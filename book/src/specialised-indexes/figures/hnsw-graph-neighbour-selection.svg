<svg class="diagram" viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hnsw-graph-neighbour-selection-title">
<title id="hnsw-graph-neighbour-selection-title">Choosing three neighbours for a new vector v at the edge of a cluster. The three nearest are all in its own cluster; the heuristic keeps one link into the other cluster instead.</title>
