<rect class="box-muted" x="10" y="28" width="300" height="196" rx="6"/>
<line class="line-a" x1="160" y1="130" x2="130" y2="170"/>
<line class="line-a" x1="160" y1="130" x2="110" y2="110"/>
<line class="line-a" x1="160" y1="130" x2="80" y2="150"/>
<circle class="box" cx="50" cy="90" r="6"/>
<circle class="box-a" cx="80" cy="150" r="6"/>
<circle class="box-a" cx="110" cy="110" r="6"/>
<circle class="box" cx="70" cy="190" r="6"/>
<circle class="box-a" cx="130" cy="170" r="6"/>
<circle class="box" cx="250" cy="100" r="6"/>
<circle class="box" cx="270" cy="150" r="6"/>
<circle class="box" cx="240" cy="180" r="6"/>
<circle class="box" cx="290" cy="120" r="6"/>
<circle class="box-b" cx="160" cy="130" r="8"/>
<text class="t-small t-bold t-b" x="160" y="117" text-anchor="middle">v</text>
<text class="t-small t-muted" x="90" y="218" text-anchor="middle">cluster 1</text>
<text class="t-small t-muted" x="265" y="218" text-anchor="middle">cluster 2</text>
<text class="t t-bold" x="480" y="18" text-anchor="middle">heuristic</text>
<rect class="box-muted" x="330" y="28" width="300" height="196" rx="6"/>
<line class="line-a" x1="480" y1="130" x2="450" y2="170"/>
<line class="line-a" x1="480" y1="130" x2="430" y2="110"/>
<line class="line-a" x1="480" y1="130" x2="560" y2="180"/>
<circle class="box" cx="370" cy="90" r="6"/>
<circle class="box" cx="400" cy="150" r="6"/>
<circle class="box-a" cx="430" cy="110" r="6"/>
<circle class="box" cx="390" cy="190" r="6"/>
<circle class="box-a" cx="450" cy="170" r="6"/>
<circle class="box" cx="570" cy="100" r="6"/>
<circle class="box" cx="590" cy="150" r="6"/>
<circle class="box-a" cx="560" cy="180" r="6"/>
<circle class="box" cx="610" cy="120" r="6"/>
<circle class="box-b" cx="480" cy="130" r="8"/>
<text class="t-small t-bold t-b" x="480" y="117" text-anchor="middle">v</text>
<text class="t-small t-muted" x="410" y="218" text-anchor="middle">cluster 1</text>
<text class="t-small t-muted" x="585" y="218" text-anchor="middle">cluster 2</text>
</svg>
