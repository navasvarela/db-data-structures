<text class="t t-mono" x="165" y="210" text-anchor="middle">c</text>
<rect class="box-a" x="210" y="84" width="50" height="40"/>
<text class="t t-mono" x="235" y="109" text-anchor="middle">d</text>
<rect class="box" x="250" y="164" width="50" height="50"/>
<text class="t t-mono" x="275" y="194" text-anchor="middle">e</text>
<rect class="line-a dashed" x="158" y="116" width="70" height="40"/>
<text class="t t-bold t-a" x="232" y="160">Q</text>
<text class="t-small t-muted" x="352" y="16">tree</text>
<rect class="box" x="440" y="40" width="40" height="28"/>
<text class="t-small t-bold" x="460" y="59" text-anchor="middle">R1</text>
<rect class="box" x="480" y="40" width="40" height="28"/>
