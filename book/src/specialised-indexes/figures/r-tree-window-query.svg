<svg class="diagram" viewBox="0 0 640 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="r-tree-window-query-title">
<title id="r-tree-window-query-title">A window query Q that falls where R1 and R2 overlap must descend into both children; it finds b under R1 and d under R2.</title>
