<text class="t t-mono" x="392" y="159" text-anchor="middle">a</text>
<rect class="box-a" x="412" y="140" width="40" height="28"/>
<text class="t t-mono" x="432" y="159" text-anchor="middle">b</text>
<rect class="box" x="500" y="140" width="40" height="28"/>
<text class="t t-mono" x="520" y="159" text-anchor="middle">c</text>
<rect class="box-a" x="540" y="140" width="40" height="28"/>
<text class="t t-mono" x="560" y="159" text-anchor="middle">d</text>
<rect class="box" x="580" y="140" width="40" height="28"/>
