<text class="t-small t-muted" x="16" y="16">space</text>
<rect class="box-muted" x="10" y="24" width="310" height="210"/>
<rect class="line" x="43" y="57" width="144" height="124"/>
<text class="t-small t-bold " x="49" y="175">R1</text>
