<text class="t-small t-muted" x="412" y="186" text-anchor="middle">leaf</text>
<text class="t-small t-muted" x="560" y="186" text-anchor="middle">leaf</text>
<text class="t-small t-muted" x="412" y="216">Q intersects both R1 and R2,</text>
<text class="t-small t-muted" x="412" y="232">so both leaves are read</text>
