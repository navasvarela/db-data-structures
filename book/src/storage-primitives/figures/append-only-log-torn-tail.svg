<svg class="diagram" viewBox="0 0 640 184" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="append-only-log-torn-tail-title">
<title id="append-only-log-torn-tail-title">The file was cut at byte 25, inside the third record. A scan yields the records at 0 and 9, then fails at 13.</title>
