<svg class="diagram" viewBox="0 0 640 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ring-buffer-cursors-title">
<title id="ring-buffer-cursors-title">A ring buffer of capacity 8 holding a to d in slots 2 to 5, with head 2 and tail 6. After pushing e, f, g and h, tail wraps to slot 2 and the buffer is full.</title>
<defs><marker id="ring-buffer-cursors-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="ring-buffer-cursors-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-a" d="M0,0L10,5L0,10z"/></marker><marker id="ring-buffer-cursors-head-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-b" d="M0,0L10,5L0,10z"/></marker></defs>
<text class="t-small t-muted" x="174" y="30" text-anchor="middle">0</text>
<text class="t-small t-muted" x="222" y="30" text-anchor="middle">1</text>
<text class="t-small t-muted" x="270" y="30" text-anchor="middle">2</text>
<text class="t-small t-muted" x="318" y="30" text-anchor="middle">3</text>
<text class="t-small t-muted" x="366" y="30" text-anchor="middle">4</text>
<text class="t-small t-muted" x="414" y="30" text-anchor="middle">5</text>
<text class="t-small t-muted" x="462" y="30" text-anchor="middle">6</text>
<text class="t-small t-muted" x="510" y="30" text-anchor="middle">7</text>
<text class="t-small t-muted" x="138" y="30" text-anchor="end">slot</text>
<rect class="box" x="150" y="40" width="48" height="36"/>
<rect class="box" x="198" y="40" width="48" height="36"/>
<rect class="box" x="246" y="40" width="48" height="36"/>
<text class="t t-mono" x="270" y="63.0" text-anchor="middle">a</text>
<rect class="box" x="294" y="40" width="48" height="36"/>
<text class="t t-mono" x="318" y="63.0" text-anchor="middle">b</text>
<rect class="box" x="342" y="40" width="48" height="36"/>
<text class="t t-mono" x="366" y="63.0" text-anchor="middle">c</text>
<rect class="box" x="390" y="40" width="48" height="36"/>
