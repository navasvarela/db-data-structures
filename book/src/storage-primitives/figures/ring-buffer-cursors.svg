<rect class="box" x="486" y="40" width="48" height="36"/>
<text class="t-small" x="138" y="63" text-anchor="end">length 4</text>
<line class="line-b" x1="270" y1="100" x2="270" y2="80" marker-end="url(#ring-buffer-cursors-head-b)"/>
<text class="t-small t-b" x="270" y="116" text-anchor="middle">head</text>
<line class="line-a" x1="462" y1="100" x2="462" y2="80" marker-end="url(#ring-buffer-cursors-head-a)"/>
<text class="t-small t-a" x="462" y="116" text-anchor="middle">tail</text>
<rect class="box-a" x="150" y="186" width="48" height="36"/>
<text class="t t-mono" x="174" y="209.0" text-anchor="middle">g</text>
