<path class="line" d="M164,84 C164,34 475.0,34 475.0,82" marker-end="url(#slotted-page-insert-head)"/>
<path class="line" d="M128,84 C128,12 560.0,12 560.0,82" marker-end="url(#slotted-page-insert-head)"/>
