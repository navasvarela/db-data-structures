<svg class="diagram" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="write-ahead-log-aries-title">
<title id="write-ahead-log-aries-title">An ARIES log with a fuzzy checkpoint at LSN 40 and 50, a crash after LSN 80, and the ranges scanned by analysis, redo and undo.</title>
<defs><marker id="write-ahead-log-aries-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-a" d="M0,0L10,5L0,10z"/></marker><marker id="write-ahead-log-aries-head-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-b" d="M0,0L10,5L0,10z"/></marker><marker id="write-ahead-log-aries-head-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-warn" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="box-muted" x="24" y="52" width="68" height="38"/>
<text class="t-small t-muted" x="58" y="75.3" text-anchor="middle">T1 P1</text>
<text class="t-small t-mono t-muted" x="58" y="106" text-anchor="middle">10</text>
<rect class="box-muted" x="92" y="52" width="68" height="38"/>
<text class="t-small t-muted" x="126" y="75.3" text-anchor="middle">T1 commit</text>
<text class="t-small t-mono t-muted" x="126" y="106" text-anchor="middle">20</text>
<rect class="box" x="160" y="52" width="68" height="38"/>
<text class="t-small" x="194" y="75.3" text-anchor="middle">T2 P2</text>
<text class="t-small t-mono t-muted" x="194" y="106" text-anchor="middle">30</text>
<rect class="box" x="228" y="52" width="68" height="38"/>
<text class="t-small t-bold" x="262" y="75.3" text-anchor="middle">begin ckpt</text>
<text class="t-small t-mono t-muted" x="262" y="106" text-anchor="middle">40</text>
<rect class="box" x="296" y="52" width="68" height="38"/>
<text class="t-small t-bold" x="330" y="75.3" text-anchor="middle">end ckpt</text>
<text class="t-small t-mono t-muted" x="330" y="106" text-anchor="middle">50</text>
<rect class="box-warn" x="364" y="52" width="68" height="38"/>
<text class="t-small" x="398" y="75.3" text-anchor="middle">T3 P1</text>
<text class="t-small t-mono t-muted" x="398" y="106" text-anchor="middle">60</text>
<rect class="box" x="432" y="52" width="68" height="38"/>
<text class="t-small" x="466" y="75.3" text-anchor="middle">T2 commit</text>
<text class="t-small t-mono t-muted" x="466" y="106" text-anchor="middle">70</text>
<rect class="box-warn" x="500" y="52" width="68" height="38"/>
<text class="t-small" x="534" y="75.3" text-anchor="middle">T3 P3</text>
<text class="t-small t-mono t-muted" x="534" y="106" text-anchor="middle">80</text>
<line class="line-warn dashed" x1="582" y1="42" x2="582" y2="214"/>
<text class="t-small t-warn" x="588" y="50">crash</text>
<text class="t-small" x="330" y="20" text-anchor="middle">dirty pages: P2 from 30</text>
<text class="t-small" x="330" y="36" text-anchor="middle">active: T2</text>
<line class="line dashed" x1="160" y1="38" x2="160" y2="94"/>
<text class="t-small t-muted" x="154" y="36" text-anchor="end">may truncate before</text>
<line class="line-a" x1="228" y1="128" x2="578" y2="128" marker-end="url(#write-ahead-log-aries-head-a)"/>
<text class="t-small t-bold t-a" x="220" y="132" text-anchor="end">1 analysis</text>
<line class="line-b" x1="160" y1="160" x2="578" y2="160" marker-end="url(#write-ahead-log-aries-head-b)"/>
<text class="t-small t-bold t-b" x="152" y="164" text-anchor="end">2 redo</text>
<line class="line-warn" x1="578" y1="192" x2="398" y2="192" marker-end="url(#write-ahead-log-aries-head-warn)"/>
<line class="line-warn" x1="534" y1="186" x2="534" y2="198"/>
<text class="t-small t-bold t-warn" x="390" y="196" text-anchor="end">3 undo T3</text>
</svg>
