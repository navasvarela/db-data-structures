<svg class="diagram" viewBox="0 0 640 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="write-ahead-log-redo-only-title">
<title id="write-ahead-log-redo-only-title">Two logs whose recovery stops at a bad record. In the first, the bad record is the last thing in the last segment, a torn tail that is truncated. In the second, valid records follow it, so it is corruption.</title>
<text class="t t-bold" x="136" y="42" text-anchor="end">torn tail</text>
<rect class="box" x="150" y="20" width="84" height="34"/>
<text class="t-small" x="192" y="41.3" text-anchor="middle">valid</text>
<rect class="box" x="234" y="20" width="84" height="34"/>
<text class="t-small" x="276" y="41.3" text-anchor="middle">valid</text>
<rect class="box" x="318" y="20" width="84" height="34"/>
<text class="t-small" x="360" y="41.3" text-anchor="middle">valid</text>
<rect class="box-warn" x="402" y="20" width="46.2" height="34"/>
<text class="t-small t-warn" x="425.1" y="41.3" text-anchor="middle">torn</text>
<text class="" x="150" y="76"></text>
<line class="line-warn" x1="402" y1="12" x2="402" y2="62"/>
<text class="t-small t-muted" x="460.2" y="42">end of file</text>
<text class="t-small t-warn" x="402" y="76" text-anchor="middle">truncate here, recovery succeeds</text>
<text class="t t-bold" x="136" y="126" text-anchor="end">corruption</text>
<rect class="box" x="150" y="104" width="84" height="34"/>
<text class="t-small" x="192" y="125.3" text-anchor="middle">valid</text>
<rect class="box-warn" x="234" y="104" width="84" height="34"/>
<text class="t-small t-warn" x="276" y="125.3" text-anchor="middle">bad</text>
<rect class="box" x="318" y="104" width="84" height="34"/>
<text class="t-small" x="360" y="125.3" text-anchor="middle">valid</text>
<rect class="box" x="402" y="104" width="84" height="34"/>
<text class="t-small" x="444" y="125.3" text-anchor="middle">valid</text>
<text class="" x="150" y="160"></text>
<text class="t-small t-warn" x="276" y="160">valid records follow: report an error</text>
</svg>
