<svg class="diagram" viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="undo-log-layout-title">
<title id="undo-log-layout-title">Transaction T7's entry in the transaction table points at its newest undo record U3, which points at U2, which points at U1, the oldest.</title>
<defs><marker id="undo-log-layout-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker></defs>
<text class="t-small t-bold" x="20" y="18">transaction table</text>
<rect class="box" x="20" y="50" width="90" height="30"/>
<text class="t-small t-bold" x="65" y="69" text-anchor="middle">T7</text>
<text class="t-small t-muted" x="65" y="98" text-anchor="middle">last undo</text>
<text class="t-small t-bold" x="146" y="18">undo records, newest first</text>
<line class="line" x1="112" y1="65" x2="142" y2="65" marker-end="url(#undo-log-layout-head)"/>
<rect class="box" x="146" y="30" width="136" height="70"/>
<text class="t-small t-bold" x="156" y="50">U3 update</text>
<text class="t-small t-mono" x="156" y="68">accounts/42</text>
<text class="t-small t-muted" x="156" y="88">before: balance = 100</text>
<line class="line" x1="284" y1="65" x2="302" y2="65" marker-end="url(#undo-log-layout-head)"/>
<rect class="box" x="306" y="30" width="136" height="70"/>
<text class="t-small t-bold" x="316" y="50">U2 delete</text>
<text class="t-small t-mono" x="316" y="68">orders/9</text>
<text class="t-small t-muted" x="316" y="88">before: whole old row</text>
<line class="line" x1="444" y1="65" x2="462" y2="65" marker-end="url(#undo-log-layout-head)"/>
<rect class="box" x="466" y="30" width="136" height="70"/>
<text class="t-small t-bold" x="476" y="50">U1 insert</text>
<text class="t-small t-mono" x="476" y="68">orders/12</text>
<text class="t-small t-muted" x="476" y="88">before: nothing</text>
<text class="t-small t-muted" x="534" y="124" text-anchor="middle">no previous record</text>
</svg>
