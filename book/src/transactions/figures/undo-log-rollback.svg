<svg class="diagram" viewBox="0 0 640 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="undo-log-rollback-title">
<title id="undo-log-rollback-title">T7's log records 10, 20 and 30, linked by PrevLSN, followed by compensation records 40, 50 and 60 written during rollback, whose UndoNxtLSN points to the next record still to undo, and an end record at 70.</title>
<defs><marker id="undo-log-rollback-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker><marker id="undo-log-rollback-head-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head-b" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="box" x="20" y="96" width="80" height="48"/>
<text class="t-small t-bold" x="60" y="116" text-anchor="middle">LSN 10</text>
<text class="t-small" x="60" y="134" text-anchor="middle">U1 insert</text>
<rect class="box" x="106" y="96" width="80" height="48"/>
<text class="t-small t-bold" x="146" y="116" text-anchor="middle">LSN 20</text>
<text class="t-small" x="146" y="134" text-anchor="middle">U2 delete</text>
<rect class="box" x="192" y="96" width="80" height="48"/>
<text class="t-small t-bold" x="232" y="116" text-anchor="middle">LSN 30</text>
<text class="t-small" x="232" y="134" text-anchor="middle">U3 update</text>
<rect class="box-b" x="278" y="96" width="80" height="48"/>
<text class="t-small t-bold" x="318" y="116" text-anchor="middle">LSN 40</text>
<text class="t-small" x="318" y="134" text-anchor="middle">CLR for U3</text>
<rect class="box-b" x="364" y="96" width="80" height="48"/>
<text class="t-small t-bold" x="404" y="116" text-anchor="middle">LSN 50</text>
<text class="t-small" x="404" y="134" text-anchor="middle">CLR for U2</text>
<rect class="box-b" x="450" y="96" width="80" height="48"/>
<text class="t-small t-bold" x="490" y="116" text-anchor="middle">LSN 60</text>
<text class="t-small" x="490" y="134" text-anchor="middle">CLR for U1</text>
<rect class="box-muted" x="536" y="96" width="80" height="48"/>
<text class="t-small t-bold" x="576" y="116" text-anchor="middle">LSN 70</text>
<text class="t-small" x="576" y="134" text-anchor="middle">end</text>
<path class="line" d="M140.0,94Q103.0,60 66.0,92" marker-end="url(#undo-log-rollback-head)"/>
<path class="line" d="M226.0,94Q189.0,60 152.0,92" marker-end="url(#undo-log-rollback-head)"/>
<text class="t-small t-muted" x="146" y="62" text-anchor="middle">PrevLSN</text>
<text class="t-small t-bold" x="30" y="20">normal work</text>
<text class="t-small t-bold t-b" x="288" y="20">rollback, newest first</text>
<path class="line-b" d="M318.0,146Q232.0,224 150.0,148" marker-end="url(#undo-log-rollback-head-b)"/>
<path class="line-b" d="M404.0,146Q232.0,268 64.0,148" marker-end="url(#undo-log-rollback-head-b)"/>
<text class="t-small t-b" x="490" y="166" text-anchor="middle">UndoNxtLSN:</text>
<text class="t-small t-b" x="490" y="182" text-anchor="middle">none</text>
<text class="t-small t-b" x="232" y="226" text-anchor="middle">UndoNxtLSN</text>
<line class="line-warn dashed" x1="361" y1="66" x2="361" y2="244"/>
<text class="t-small t-warn" x="367" y="76">a crash here</text>
</svg>
