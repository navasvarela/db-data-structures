# Only stable options are enabled, so `cargo fmt`, rust-analyzer's format-on-save and CI all
# agree on the pinned toolchain without needing nightly. Unstable options are listed at the
# bottom; stable rustfmt warns on every run if they are enabled, so they stay commented out.

# Keep in sync with Cargo.toml. `cargo fmt` reads the edition from the manifest, but editors
# and direct `rustfmt` invocations do not.
edition = "2024"
style_edition = "2024"

max_width = 100
newline_style = "Unix"

# `Point { x: x }` -> `Point { x }` and `try!(expr)` -> `expr?`.
use_field_init_shorthand = true
use_try_shorthand = true

# Adds a trailing comma after `}` in block match arms, so adding an arm below one is a
# one-line diff.
match_block_trailing_comma = true

# --- Nightly-only (run with `cargo +nightly fmt` to use) ---------------------------------
#
# Merges `use` statements into one per module and groups them as std / external / crate,
# which removes most import-ordering noise from diffs.
# imports_granularity = "Module"
# group_imports = "StdExternalCrate"
#
# Rewraps comments and doc comments to the line width and formats Rust code in doc examples.
# wrap_comments = true
# comment_width = 100
# format_code_in_doc_comments = true
#
# Orders impl items as: type, const, macro, fn.
# reorder_impl_items = true
#
# Formats `macro_rules!` matchers like regular code.
# format_macro_matchers = true
